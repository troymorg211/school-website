services:
  - type: web
    name: bright-future-school-demo
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: DEMO_BACKEND
        value: server
